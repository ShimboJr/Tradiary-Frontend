<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary Meta ───────────────────────────────────────────────── -->
    <title>Tradiary — Your trading diary, with analytics</title>
    <meta name="description" content="The free trading journal for serious traders. Log trades, review your edge, and improve — with deep analytics built in." />
    <meta name="theme-color" content="#0B1220" />
    <meta name="color-scheme" content="dark light" />

    <!-- ── Open Graph (static — crawlers don't execute JS) ───────────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Tradiary" />
    <meta property="og:title"       content="Tradiary — Your trading diary, with analytics" />
    <meta property="og:description" content="The free trading journal for serious traders. Log trades, review your edge, and improve." />
    <meta property="og:image"       content="https://tradiary.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url"         content="https://tradiary.app" />

    <!-- ── Twitter / X Card ──────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Tradiary — Your trading diary, with analytics" />
    <meta name="twitter:description" content="The free trading journal for serious traders. Log trades, review your edge, and improve." />
    <meta name="twitter:image"       content="https://tradiary.app/og-image.png" />

    <!-- ── Favicons & App Icons ──────────────────────────────────────── -->
    <link rel="icon"             type="image/svg+xml"  href="/favicon.svg" />
    <link rel="icon"             type="image/x-icon"   href="/favicon.ico" sizes="16x16 32x32" />
    <link rel="apple-touch-icon"                       href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest"                               href="/site.webmanifest" />

    <!-- ── Google Fonts: Inter + Manrope + JetBrains Mono ───────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
